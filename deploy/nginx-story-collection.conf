# =============================================================================
# 故事收藏屋 - Nginx 站点配置（Windows Server 2012）
# 访问地址: https://<你的域名>/story/
# =============================================================================
#
# 使用方式:
#   1. 将本文件复制到 Nginx 配置目录，例如: C:/nginx/conf/conf.d/story-collection.conf
#   2. 在 nginx.conf 的 http 块中加入: include conf.d/*.conf;
#   3. 修改下方【必改项】
#   4. 测试并重载:
#        nginx -t
#        nginx -s reload
#
# 项目部署:
#   将仓库内容放到服务器目录，例如: D:/web/story-collection/
#   确保目录下存在:
#     index.html
#     series/          （连载系列，含 rose-princess/epNN-...）
#     oneshots/        （独立单本）
# =============================================================================

server {
    listen       443 ssl;
    server_name  your-domain.com;          # 【必改】替换为实际域名或服务器 IP

    # ---------- SSL 证书（【必改】替换为实际证书路径）----------
    ssl_certificate      C:/nginx/ssl/your-domain.crt;
    ssl_certificate_key  C:/nginx/ssl/your-domain.key;

    # Windows Server 2012 兼容的 TLS 设置
    ssl_protocols        TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    charset utf-8;

    access_log  logs/story-collection.access.log;
    error_log   logs/story-collection.error.log;

    # /story 无尾斜杠时，重定向到 /story/
    location = /story {
        return 301 /story/;
    }

    # 故事收藏屋静态站点
    # 项目内 HTML/图片均为相对路径，挂载子路径 /story/ 即可正常访问
    location /story/ {
        # 【必改】项目根目录，末尾必须带 /
        alias D:/web/story-collection/;

        index index.html;
        autoindex off;

        # 静态资源缓存（图片、字体等）
        expires 7d;
        add_header Cache-Control "public";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ---------- 可选：HTTP 80 端口自动跳转 HTTPS ----------
# server {
#     listen      80;
#     server_name your-domain.com;
#     return 301 https://$host/story/;
# }
