# 代码推送到 GitHub 后，镜像同步到 Gitee。
# 使用仓库 / Cursor 网页已配置的 GITEE_TOKEN（Gitee 私人令牌）。
name: Sync to Gitee

on:
  push:
  workflow_dispatch:

concurrency:
  group: sync-to-gitee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_PRIVATE_TOKEN: ${{ secrets.GITEE_PRIVATE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ] && [ -z "${GITEE_PRIVATE_TOKEN:-}" ]; then
            echo "::warning::GitHub Actions 里没有 GITEE_TOKEN。把网页上已配置的同一个 Gitee 令牌添加到本仓库 Settings → Secrets → Actions（名称必须是 GITEE_TOKEN）后，推送就会自动同步。Cursor / 本地请用环境变量或 tools/.env，运行 bash tools/sync_to_gitee.sh。"
            exit 0
          fi
          bash tools/sync_to_gitee.sh --ref "${{ github.ref }}"
